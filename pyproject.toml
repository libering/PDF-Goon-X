[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-goon"
version = "1.0"
description = "Extract and render images from PDF files using Poppler tools"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
pdf-goon = "pdf_goon.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
