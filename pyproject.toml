[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-goon"
version = "1.0.1"
description = "Extract and render images from PDF files with smart per-page decision logic"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pypdf>=5.0.0",
    "pypdfium2>=4.0",
    "Pillow>=10.0.0",
    "cryptography>=3.1",
]

[project.scripts]
pdf-goon = "pdf_goon.cli:main"

[tool.setuptools.packages.find]
include = ["pdf_goon*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.mypy]
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "corpus: Heavy real-world PDF corpus integration tests (run with -m corpus)",
]
addopts = "-m 'not corpus'"
