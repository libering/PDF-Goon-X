[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-goon"
version = "1.0.0b0"
description = "Extract and render images from PDF files with smart per-page decision logic"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pypdf>=5.0.0",
    "pypdfium2>=4.0",
    "Pillow>=10.0.0",
]
[project.scripts]
pdf-goon = "pdf_goon.cli:main"


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.mypy]
[[tool.mypy.overrides]]
module = "pypdfium2"
ignore_missing_imports = true
